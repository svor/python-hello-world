schemaVersion: 2.2.2
metadata:
  name: python-hello-world-new-devfile
components:
  - name: python
    container:
      image: quay.io/devfile/universal-developer-image:ubi10-latest
      volumeMounts:
        - name: venv
          path: /home/user/.venv
      memoryLimit: '2Gi'
      memoryRequest: '1Gi'
      cpuLimit: '2'
      cpuRequest: '1'
      mountSources: true
  - name: venv
    volume:
      size: 1G
commands:
  - id: run
    exec:
      label: "Run the application"
      component: python
      workingDir: ${PROJECTS_ROOT}/python-hello-world
      commandLine: python -m venv .venv && . .venv/bin/activate && python hello-world.py
      group:
        kind: run
  - id: test-command-2
    exec:
      label: "Run loop"
      component: python
      workingDir: ${PROJECTS_ROOT}/python-hello-world
      commandLine: |
        export PUBLISHERS="DotJoshJohnson eamodio felixfbecker formulahendry HookyQR ms-azuretools ms-mssql ms-python ms-vscode octref redhat ritwickdey sburg vscode vscodevim Wscats"
        for pub in $PUBLISHERS; do echo $pub; done
      group:
        kind: run
  - id: test-command
    exec:
      label: "Run test command"
      component: python
      workingDir: ${PROJECTS_ROOT}/python-hello-world
      commandLine: |
          python -m venv .venv &&
          . .venv/bin/activate &&
          python hello-world.py
      group:
        kind: run
